plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ===== AdMob IDs: paste your REAL ids here (only place to change) =====
// Debug builds ALWAYS use Google's official TEST ids. Release builds use ONLY the real ids below.
// A release build (assembleRelease / bundleRelease) FAILS with a clear message if any real id is empty,
// is a placeholder, has a wrong format, is a Google TEST id, or belongs to a different AdMob publisher.
def ADMOB_REAL_APP_ID = "ca-app-pub-8981669587444390~9685064037" // ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
def ADMOB_REAL_BANNER = "ca-app-pub-8981669587444390/8479793577" // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
def ADMOB_REAL_INTERSTITIAL = "ca-app-pub-8981669587444390/5277693971" // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
def ADMOB_REAL_REWARDED = "ca-app-pub-8981669587444390/8040809878" // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ

def ADMOB_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def ADMOB_TEST_BANNER = "ca-app-pub-3940256099942544/6300978111"
def ADMOB_TEST_INTERSTITIAL = "ca-app-pub-3940256099942544/1033173712"
def ADMOB_TEST_REWARDED = "ca-app-pub-3940256099942544/5224354917"

// ---- Release safety gate: no placeholder / test / malformed id can reach a release build ----
def admobProblems = []
def admobCheck = { String label, String value, String re ->
    if (value == null || value.trim().isEmpty()) {
        admobProblems << "${label} is empty"
    } else if (value.contains("XXXX") || value.contains("YYYY") || value.contains("ZZZZ")) {
        admobProblems << "${label} is still a placeholder (${value})"
    } else if (!value.matches(re)) {
        admobProblems << "${label} has a wrong format (${value})"
    } else if (value.contains("3940256099942544")) {
        admobProblems << "${label} is a Google TEST id (${value}) - not allowed in release"
    }
}
admobCheck("ADMOB_REAL_APP_ID", ADMOB_REAL_APP_ID, '^ca-app-pub-\\d{16}~\\d{10}$')
admobCheck("ADMOB_REAL_BANNER", ADMOB_REAL_BANNER, '^ca-app-pub-\\d{16}/\\d{10}$')
admobCheck("ADMOB_REAL_INTERSTITIAL", ADMOB_REAL_INTERSTITIAL, '^ca-app-pub-\\d{16}/\\d{10}$')
admobCheck("ADMOB_REAL_REWARDED", ADMOB_REAL_REWARDED, '^ca-app-pub-\\d{16}/\\d{10}$')
if (admobProblems.isEmpty()) {
    def pubs = [ADMOB_REAL_APP_ID, ADMOB_REAL_BANNER, ADMOB_REAL_INTERSTITIAL, ADMOB_REAL_REWARDED]
            .collect { it.substring("ca-app-pub-".length(), "ca-app-pub-".length() + 16) }.unique()
    if (pubs.size() != 1) admobProblems << "the 4 real ids belong to different publishers: ${pubs}"
}
gradle.taskGraph.whenReady { graph ->
    def releaseBuild = graph.allTasks.any { it.path.startsWith(":app:") && it.name.toLowerCase().contains("release") }
    if (releaseBuild && !admobProblems.isEmpty()) {
        throw new GradleException("RELEASE BLOCKED - AdMob ids in app/build.gradle are not valid:\n  - " +
                admobProblems.join("\n  - "))
    }
}

// ===== Version: change ONLY here for every new Play Store release =====
def r7VersionCode = 2
def r7VersionName = "1.1"

android {
    namespace 'com.r7studio.r7Playapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.r7studio.r7Playapp1"
        minSdk 24
        targetSdk 36
        versionCode r7VersionCode
        versionName r7VersionName
    }

    // Release signing: ONLY from environment variables (no password or key file in the repo).
    def ksPath = System.getenv("KEYSTORE_PATH")
    def ksPass = System.getenv("KEYSTORE_PASSWORD")
    def ksAlias = System.getenv("KEY_ALIAS")
    def keyPass = System.getenv("KEY_PASSWORD")
    def canSign = ksPath && ksPass && ksAlias && keyPass && new File(ksPath).exists()

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: ADMOB_TEST_APP_ID]
            buildConfigField "String", "ADMOB_BANNER", "\"${ADMOB_TEST_BANNER}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"${ADMOB_TEST_INTERSTITIAL}\""
            buildConfigField "String", "ADMOB_REWARDED", "\"${ADMOB_TEST_REWARDED}\""
        }
        release {
            // real ids only (validated by the release safety gate above)
            manifestPlaceholders = [admobAppId: ADMOB_REAL_APP_ID]
            buildConfigField "String", "ADMOB_BANNER", "\"${ADMOB_REAL_BANNER}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"${ADMOB_REAL_INTERSTITIAL}\""
            buildConfigField "String", "ADMOB_REWARDED", "\"${ADMOB_REAL_REWARDED}\""
            if (canSign) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // secure JS <-> Kotlin channel with origin rules (online games' ads bridge)
    implementation 'androidx.webkit:webkit:1.12.1'

    // Google AdMob (Google Mobile Ads SDK 25.x, includes the UMP consent SDK). 25.x needs minSdk 24+ and Kotlin 2.3+ (SDK 25.5.0 uses newer Kotlin metadata).
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
