plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ===== AdMob IDs: paste your REAL ids here (only place to change) =====
// Debug builds ALWAYS use Google's official TEST ids. Release builds use the real ids below;
// while any of the 4 real ids is empty, release also uses the TEST ids (safe: no invalid-traffic risk).
def ADMOB_REAL_APP_ID = ""           // ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
def ADMOB_REAL_BANNER = ""           // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
def ADMOB_REAL_INTERSTITIAL = ""     // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
def ADMOB_REAL_REWARDED = ""         // ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ

def ADMOB_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def ADMOB_TEST_BANNER = "ca-app-pub-3940256099942544/6300978111"
def ADMOB_TEST_INTERSTITIAL = "ca-app-pub-3940256099942544/1033173712"
def ADMOB_TEST_REWARDED = "ca-app-pub-3940256099942544/5224354917"
def admobUseReal = (ADMOB_REAL_APP_ID != "" && ADMOB_REAL_BANNER != "" &&
        ADMOB_REAL_INTERSTITIAL != "" && ADMOB_REAL_REWARDED != "")

// ===== Version: change ONLY here for every new Play Store release =====
def r7VersionCode = 2
def r7VersionName = "1.1"

android {
    namespace 'com.r7studio.r7Playapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.r7studio.r7Playapp1"
        minSdk 24
        targetSdk 36
        versionCode r7VersionCode
        versionName r7VersionName
    }

    // Release signing: ONLY from environment variables (no password or key file in the repo).
    def ksPath = System.getenv("KEYSTORE_PATH")
    def ksPass = System.getenv("KEYSTORE_PASSWORD")
    def ksAlias = System.getenv("KEY_ALIAS")
    def keyPass = System.getenv("KEY_PASSWORD")
    def canSign = ksPath && ksPass && ksAlias && keyPass && new File(ksPath).exists()

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: ADMOB_TEST_APP_ID]
            buildConfigField "String", "ADMOB_BANNER", "\"${ADMOB_TEST_BANNER}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"${ADMOB_TEST_INTERSTITIAL}\""
            buildConfigField "String", "ADMOB_REWARDED", "\"${ADMOB_TEST_REWARDED}\""
        }
        release {
            manifestPlaceholders = [admobAppId: admobUseReal ? ADMOB_REAL_APP_ID : ADMOB_TEST_APP_ID]
            buildConfigField "String", "ADMOB_BANNER", "\"${admobUseReal ? ADMOB_REAL_BANNER : ADMOB_TEST_BANNER}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"${admobUseReal ? ADMOB_REAL_INTERSTITIAL : ADMOB_TEST_INTERSTITIAL}\""
            buildConfigField "String", "ADMOB_REWARDED", "\"${admobUseReal ? ADMOB_REAL_REWARDED : ADMOB_TEST_REWARDED}\""
            if (canSign) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Google AdMob (includes the UMP consent SDK)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
